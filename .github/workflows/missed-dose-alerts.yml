name: Missed-dose alerts

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: missed-dose-alerts
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      # Keeps the checker's Firebase sign-in between runs.
      - uses: actions/cache@v4
        with:
          path: .alert-token
          key: alert-token-${{ github.run_id }}
          restore-keys: alert-token-

      - name: Check Yuki's log
        env:
          HOUSEHOLD_CODE: ${{ secrets.HOUSEHOLD_CODE }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: python scripts/check_missed.py
