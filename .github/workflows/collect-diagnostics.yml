name: Collect diagnostics

# Copies problem reports from David's apps out of Firestore into data/diag/.
# Runs every hour, on demand, and whenever data/diag/pull.txt changes.
on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
  push:
    paths: ["data/diag/pull.txt"]

concurrency:
  group: collect-diagnostics
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - uses: actions/cache@v4
        with:
          path: .diag-token
          key: diag-token-${{ github.run_id }}
          restore-keys: diag-token-
      - run: python scripts/collect_diag.py
      - name: Commit new reports
        run: |
          git add data/diag
          if git diff --cached --quiet; then echo "Nothing new"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898799+github-actions[bot]@users.noreply.github.com" commit -m "Diagnostics from the apps"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
